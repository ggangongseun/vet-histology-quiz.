<p class="sub">먼저 직접 답안을 작성한 뒤 <b>모범답안 보기</b>를 눌러 비교하세요. 내용은 업로드된 수업자료의 용어와 범위를 우선했습니다.</p>

<script>
const mc = [{"q": "곱슬정세관의 벽을 구성하는 3개 층의 조합으로 옳은 것은?", "options": ["고유층–기저판–중층정세관상피", "혈관막–백색막–정세관상피", "고유층–근육층–장막", "기저판–평활근층–단층입방상피", "외막–점막하층–중층편평상피"], "answer": 0, "explanation": "곱슬정세관은 고유층, 기저판, 중층정세관상피(생식상피)의 3층으로 제시된다. 고유층의 가장 안쪽에는 근육성세포(myoid/peritubular cell)가 있다."}, {"q": "혈액고환관문(blood-testis barrier)에 대한 설명으로 수업자료에 가장 부합하는 것은?", "options": ["정세관 내강과 혈액 사이의 모든 물질 이동을 완전히 차단한다.", "Sertoli cell의 폐쇄띠를 포함하며 기저구획과 속공간인접구획을 구분한다.", "Leydig cell 사이의 폐쇄띠가 주성분이다.", "고환그물의 단층입방상피가 직접 형성한다.", "부고환관의 stereocilia가 형성한다."], "answer": 1, "explanation": "자료에서는 폐쇄띠(tight junction)를 중심으로 혈액고환관문이 형성되고, 기저구획과 속공간인접구획(adluminal compartment)을 구분하는 것으로 제시된다."}, {"q": "Sertoli cell의 분비기능에 대한 연결 중 옳지 않은 것은?", "options": ["androgen-binding protein — 안드로겐 결합", "inhibin — FSH에 대한 음성 되먹임", "activin — FSH에 대한 양성 되먹임", "anti-Müllerian hormone — 태아기 Sertoli cell", "testosterone — Sertoli cell의 대표적 주 분비물"], "answer": 4, "explanation": "자료에서는 testosterone을 Leydig의 사이질세포 분비물로, Sertoli cell에서는 androgen-binding protein, inhibin, activin, anti-Müllerian hormone 등을 제시한다."}, {"q": "Leydig cell을 전자현미경 및 광학현미경 소견으로 연결한 것 중 옳은 것은?", "options": ["Reinke 결정, sER, lipid droplets — testosterone 분비", "stereocilia, secretory granules — inhibin 분비", "폐쇄띠, actin bundle — fructose 분비", "섬모, 기저세포 — testosterone 분비", "중층상피, keratohyalin granules — androgen 분비"], "answer": 0, "explanation": "자료에서 Leydig cell은 testosterone을 분비하며, EM에서 Reinke crystal, sER, lipid droplets가 제시된다."}, {"q": "정자발생 과정의 순서를 가장 정확하게 배열한 것은?", "options": ["정조세포 → 제1차 정모세포 → 제2차 정모세포 → 정자세포 → 정자", "정조세포 → 제2차 정모세포 → 제1차 정모세포 → 정자 → 정자세포", "제1차 정모세포 → 정조세포 → 제2차 정모세포 → 정자세포 → 정자", "정조세포 → 정자세포 → 제1차 정모세포 → 제2차 정모세포 → 정자", "정조세포 → 제1차 정모세포 → 정자 → 제2차 정모세포 → 정자세포"], "answer": 0, "explanation": "자료의 spermatocytogenesis와 meiosis 흐름은 정조세포 → 제1차 정모세포 → 제2차 정모세포 → 정자세포이고, 이후 spermiogenesis를 거쳐 정자가 된다."}, {"q": "정자형성(spermiogenesis)의 단계 순서로 옳은 것은?", "options": ["Golgi → cap → acrosome → maturation", "cap → Golgi → maturation → acrosome", "Golgi → acrosome → cap → maturation", "maturation → cap → Golgi → acrosome", "Golgi → maturation → cap → acrosome"], "answer": 0, "explanation": "자료에서는 spermiogenesis의 4단계를 Golgi phase, cap phase, acrosome phase, maturation phase 순으로 제시한다."}, {"q": "정세관상피의 주기와 정자발생 전체 소요기간에 대한 자료의 수치를 바르게 연결한 것은?", "options": ["1주기 8일, 총 32일", "1주기 12일, 총 48일", "1주기 16일, 4주기이므로 64일", "1주기 16일, 6주기이므로 96일", "1주기 20일, 총 80일"], "answer": 2, "explanation": "자료에는 1주기가 16일이고 정자발생에 4주기가 필요하여 64일이며, 별도로 정조세포가 정자로 되는 데 74일이라는 문구도 제시된다."}, {"q": "곧은정세관(tubuli recti)에 대한 설명으로 옳은 것은?", "options": ["0.5–1.0 mm의 짧은 구간이며 단층입방상피가 Sertoli cell로만 구성된다.", "고환종격 내에 위치하며 항상 거짓중층원주상피이다.", "10–15개의 세관으로 이루어지고 섬모세포가 주를 이룬다.", "4–6 m 길이의 하나의 긴 나선형 관이다.", "평활근의 3층 구조를 가진다."], "answer": 0, "explanation": "자료에서 tubuli recti는 0.5–1.0 mm의 짧은 구간이며 단층입방상피, Sertoli cell로만 구성된다고 제시된다."}, {"q": "고환그물(rete testis)과 고환날세관(ductuli efferentes)의 차이를 가장 잘 설명한 것은?", "options": ["둘 다 단층입방상피이며 고환종격과 무관하다.", "rete testis는 고환종격 내에 있고, ductuli efferentes는 섬모세포·무섬모세포·기저세포를 포함하는 상피와 평활근층을 가진다.", "rete testis는 10–15개의 세관으로 이루어진다.", "ductuli efferentes는 Sertoli cell만으로 구성된다.", "둘 다 부고환관의 4–6 m 길이 나선형 관이다."], "answer": 1, "explanation": "자료에서 rete testis는 고환종격 내 단층입방 또는 단층원주상피, ductuli efferentes는 10–15개 세관으로 섬모세포·무섬모세포·기저세포와 평활근층을 가진다."}, {"q": "부고환관과 정관을 구별하는 소견으로 가장 적절한 것은?", "options": ["부고환관은 거짓중층원주상피와 stereocilia, 정관은 부동모가 있는 거짓중층원주상피와 3층 근육구조를 가진다.", "부고환관은 중층편평상피, 정관은 단층입방상피이다.", "부고환관은 섬모세포만, 정관은 Sertoli cell만 가진다.", "부고환관은 고환종격 내, 정관은 신장수질 내에 있다.", "둘 다 근육층이 없다."], "answer": 0, "explanation": "자료에서는 부고환관이 거짓중층원주상피, 주세포·기저세포, stereocilia를 가지며, 정관은 부동모가 있는 거짓중층원주상피와 안쪽·바깥쪽 세로층 및 중간 돌림층의 근육층을 가진다고 제시한다."}, {"q": "부고환관의 길이와 조직학적 특징에 대한 조합으로 옳은 것은?", "options": ["약 4–6 m의 하나의 긴 나선형 관 — 거짓중층원주상피 — stereocilia", "약 30 cm — 단층입방상피 — 섬모", "약 2 cm — 단층원주상피 — 정세포", "약 15 cm의 두 관 — 중층편평상피 — microvilli 없음", "약 0.5–1.0 mm — Sertoli cell만 존재"], "answer": 0, "explanation": "자료에서 부고환관은 부고환 내에서 나선형으로 꼬인 하나의 긴 관(4–6 m)이며 거짓중층원주상피와 stereocilia를 가진다."}, {"q": "정관의 근육층 배열을 안쪽에서 바깥쪽으로 옳게 배열한 것은?", "options": ["세로–돌림–세로", "돌림–세로–돌림", "돌림–세로–세로", "세로–세로–돌림", "단일 돌림층"], "answer": 2, "explanation": "자료에서는 정관의 근육층이 안쪽과 바깥쪽의 세로층, 중간의 돌림층으로 제시된다."}, {"q": "사정관(ejaculatory duct)에 대한 설명으로 옳은 것은?", "options": ["약 2 cm이며 전립샘에 묻혀 있고 전립샘부분 요도에 열린다.", "약 30 cm이며 부고환에서 시작한다.", "고환종격 내에서 고환그물로 열린다.", "4–6 m이며 stereocilia를 가진다.", "요생식격막에 위치하고 해면체요도로 열린다."], "answer": 0, "explanation": "자료에서 사정관은 약 2 cm, 직경 0.1–0.3 mm이며 전립샘에 묻혀 있고 전립샘요도에 열린다."}, {"q": "정낭(seminal vesicle)의 분비물에 관한 설명으로 옳은 것은?", "options": ["사정액의 약 70%를 차지하고 fructose, citrate, inositole, prostaglandin 등을 함유한다.", "주로 testosterone을 분비하며 사정액의 70%를 차지한다.", "pH 3 정도의 산성 분비물이며 정자 운동을 억제한다.", "점액만 분비하며 prostaglandin은 포함하지 않는다.", "전립샘돌을 주성분으로 분비한다."], "answer": 0, "explanation": "자료에서는 정낭 분비물이 노란색·점도가 높고 사정액의 70%를 차지하며 pH 7.2, fructose/citrate/inositole/prostaglandin 등을 함유한다고 제시한다."}, {"q": "전립샘에 대한 설명으로 옳지 않은 것은?", "options": ["30–50개의 분지된 관포상샘으로 구성된다.", "관은 전립샘요도로 열린다.", "상피는 단층 또는 거짓중층원주상피이다.", "전립샘돌(prostatic concretion, corpora amylacea)이 관찰될 수 있다.", "피막은 골격근이 풍부한 섬유탄력피막이다."], "answer": 4, "explanation": "자료에서는 전립샘 피막이 평활근섬유가 풍부한 섬유탄력피막이라고 제시한다. 골격근이 아니라 평활근이다."}, {"q": "요도망울샘에 대한 설명으로 옳은 것은?", "options": ["직경 3–5 mm의 관포상샘이며 요생식격막에 있고 해면체요도로 열린다.", "전립샘요도에 열리고 전립샘 안에 묻혀 있다.", "고환종격에 위치하며 rete testis로 열린다.", "4–6 m 길이의 관으로 stereocilia를 가진다.", "피막이 평활근섬유로만 구성된다."], "answer": 0, "explanation": "자료에서 요도망울샘은 직경 3–5 mm의 관포상샘으로 요생식격막에 위치하고 해면체요도에 열리며, 점액분비세포를 가진 단층입방/원주상피를 보인다."}, {"q": "음경의 발기조직 구성으로 옳은 것은?", "options": ["2개의 음경해면체와 1개의 요도해면체", "1개의 음경해면체와 2개의 요도해면체", "3개의 요도해면체", "2개의 해면체와 1개의 고환해면체", "1개의 음경해면체만"], "answer": 0, "explanation": "자료에서는 3개의 원통형 발기조직, 즉 2개의 corpora cavernosa와 1개의 corpus spongiosum을 제시한다."}, {"q": "음경의 해면체동굴과 지주를 조직학적으로 연결한 것으로 옳은 것은?", "options": ["정맥공간은 창없는 내피세포, 지주는 결합조직섬유와 평활근세포", "정맥공간은 중층편평상피, 지주는 골격근만", "정맥공간은 Sertoli cell, 지주는 Leydig cell", "정맥공간은 단층입방상피, 지주는 섬모세포", "정맥공간은 각질화상피, 지주는 탄력연골"], "answer": 0, "explanation": "자료에서 venous space는 창없는 내피세포, trabecula는 결합조직섬유와 평활근세포로 구성된다고 제시된다."}, {"q": "음경 혈관과 발기의 관계에 대한 자료의 설명으로 옳은 것은?", "options": ["음경깊은동맥은 corpora cavernosa로 가고, helicine arteries와 동정맥연결이 제시된다.", "음경등동맥은 corpora cavernosa만 공급하고 깊은동맥은 피부만 공급한다.", "helicine arteries는 림프관이며 발기와 무관하다.", "수출정맥은 정세관의 정자를 운반한다.", "자료에서는 혈관과 발기의 관계를 다루지 않는다."], "answer": 0, "explanation": "자료에서는 음경등동맥이 corpus spongiosum, bulb, skin에, 음경깊은동맥이 corpora cavernosa에 가며, helicine arteries와 동정맥연결(arteriovenous shunt)이 제시된다."}, {"q": "다음 중 '관의 흐름'과 조직학적 구조를 가장 일관되게 연결한 것은?", "options": ["곱슬정세관 → 곧은정세관 → 고환그물 → 고환날세관 → 부고환관", "곱슬정세관 → 부고환관 → 고환그물 → 정관 → 고환날세관", "고환그물 → 곱슬정세관 → 고환날세관 → 정관 → 부고환관", "곧은정세관 → 곱슬정세관 → 고환그물 → 정관 → 부고환관", "곱슬정세관 → 고환그물 → 곧은정세관 → 부고환관 → 고환날세관"], "answer": 0, "explanation": "자료의 intratesticular genital tract는 tubuli recti → rete testis → ductuli efferentes이고, 정세관에서 시작해 부고환관으로 이어진다."}];
const essay = [{"q": "수컷생식계통을 생식샘, 생식관, 바깥생식기관으로 구분하고 각 범주에 해당하는 구조를 자료에 따라 정리하시오.", "a": "생식샘은 고환이며, 생식관에는 곧은정세관·고환그물·고환날세관·부고환관·정관·사정관·요도가 포함된다. 바깥생식기관에는 음경과 음낭이 포함된다."}, {"q": "고환의 바깥막을 구성하는 고환집막, 백색막, 혈관막의 특징과 백색막에서 형성되는 구조를 설명하시오.", "a": "자료에서 바깥막으로 고환집막, 백색막, 혈관막을 제시한다. 백색막과 관련하여 고환종격과 고환사이막이 제시되며, 고환사이막에 의해 고환소엽이 구분된다."}, {"q": "고환소엽의 수와 내부 구성요소를 설명하시오.", "a": "자료에서는 약 250개의 고환소엽이 제시된다. 각 소엽에는 1–4개의 정세관이 있고, 정세관 사이에는 고환사이질(interstitium of testis)이 있다."}, {"q": "곱슬정세관의 직경과 길이, 벽의 3개 층을 설명하시오.", "a": "직경은 약 150–300 μm, 길이는 약 30–70 cm이며 성숙한 소에서는 5000 m라는 자료의 수치가 제시된다. 벽은 고유층, 기저판, 중층정세관상피로 구성된다."}, {"q": "곱슬정세관의 고유층에서 myoid cell(peritubular cell)의 위치를 설명하시오.", "a": "고유층은 여러 층의 섬유모세포로 구성된 섬유성 결합조직이며, 가장 안쪽에 근육성세포(myoid cell, peritubular cell)가 있다."}, {"q": "중층정세관상피의 두 가지 주요 세포군을 쓰고 각각의 의미를 설명하시오.", "a": "정자발생세포(spermatogenic cells)와 지지세포(supporting/Sertoli cells)로 구성된다. 전자는 정자발생 과정에 참여하고, Sertoli cell은 발생 정자를 지지·보호·영양 상태 조절하며 여러 물질을 분비한다."}, {"q": "Sertoli cell의 주요 기능을 최소 5가지 항목으로 정리하시오.", "a": "정자 지지·보호·영양상태 조절, 포식작용, androgen-binding protein 분비, inhibin 분비, activin 분비, 태아기 anti-Müllerian hormone 분비 등이 자료에 제시된다."}, {"q": "Sertoli cell이 분비하는 androgen-binding protein, inhibin, activin의 역할을 자료의 표현에 맞춰 설명하시오.", "a": "androgen-binding protein은 안드로겐 결합과 관련되고, inhibin은 FSH에 대한 음성 되먹임, activin은 FSH에 대한 양성 되먹임으로 자료에 제시된다."}, {"q": "태아기 Sertoli cell과 anti-Müllerian hormone의 관계를 설명하시오.", "a": "자료에서는 fetal Sertoli cell의 분비물로 anti-Müllerian hormone을 제시하며, 태아 초기 분비라는 설명이 함께 제시된다."}, {"q": "혈액고환관문을 구성하는 세포 수준의 특징과 그 결과 생기는 두 구획을 설명하시오.", "a": "자료의 도식에서는 Sertoli cell 사이의 폐쇄띠와 관련하여 혈액고환관문이 형성되고, 기저구획(basal compartment)과 속공간인접구획(adluminal compartment)으로 구분된다. 또한 고환이 immune-privilege site로 제시된다."}, {"q": "고환사이질(interstitial tissue)의 구성요소와 Leydig cell의 위치를 설명하시오.", "a": "고환사이질에는 성긴결합조직 속 혈관, 림프관, 신경 및 사이질세포가 있다. Leydig cell은 이 사이질에 위치한다."}, {"q": "Leydig cell의 기능과 주요 세포학적 특징을 설명하시오.", "a": "Leydig cell은 testosterone을 분비한다. 자료에서는 EM 소견으로 Reinke crystal, sER, lipid droplets를 제시하고, HE에서 호산성(eosinophilic)인 특징을 제시한다."}, {"q": "정자발생(spermatogenesis)을 spermatocytogenesis와 spermiogenesis로 나누어 설명하시오.", "a": "spermatocytogenesis는 정조세포에서 제1차 정모세포, 제2차 정모세포, 정자세포로 이어지는 과정이고, spermiogenesis는 정자세포가 세포분화를 거쳐 정자로 되는 과정이다."}, {"q": "정조세포 A와 B에서 제1차 정모세포로 이어지는 과정을 설명하시오.", "a": "자료의 도식에서는 spermatogonia A가 유사분열을 하고 늦정조세포(spermatogonia B)를 거쳐 제1차 정모세포(primary spermatocyte)로 이어진다."}, {"q": "감수분열에서 제1차 정모세포, 제2차 정모세포, 정자세포의 관계를 설명하시오.", "a": "제1차 정모세포가 제1차 감수분열을 거쳐 제2차 정모세포가 되고, 제2차 감수분열을 거쳐 정자세포(spermatids)가 된다."}, {"q": "정자형성의 4단계를 순서대로 쓰고 각 단계의 핵심 의미를 간단히 설명하시오.", "a": "순서는 Golgi phase → cap phase → acrosome phase → maturation phase이다. 자료에서는 이를 정자세포에서 정자로의 세포분화 단계로 제시한다."}, {"q": "정자발생 기간에 관한 자료의 두 수치(74일과 64일)를 어떻게 구분하여 서술할 수 있는지 설명하시오.", "a": "자료에는 정조세포가 정자로 되는 데 74일이 걸린다는 문구가 있고, 정세관상피 주기는 16일이며 정자발생은 4주기(64일)라는 별도의 수치가 제시된다. 따라서 두 수치를 동일한 의미로 임의로 통합하지 않고 자료에 제시된 표현대로 구분해야 한다."}, {"q": "세포사이다리(intercellular bridge)의 의미를 정자발생 맥락에서 설명하시오.", "a": "자료는 정자발생 과정에서 세포사이다리(intercellular bridge)를 언급한다. 이는 발생 중인 생식세포들이 세포질 연결을 유지하는 구조라는 맥락으로 이해할 수 있으며, 답안에서는 자료의 용어를 중심으로 서술한다."}, {"q": "고환내 생식관(intratesticular genital tract)의 세 부분을 순서대로 쓰시오.", "a": "곧은정세관(tubuli recti) → 고환그물(rete testis) → 고환날세관(ductuli efferentes) 순이다."}, {"q": "곧은정세관의 길이, 상피, 세포 구성을 설명하시오.", "a": "0.5–1.0 mm의 짧은 구간이며 단층입방상피로 구성되고, 자료에서는 Sertoli cell로만 구성된다고 제시한다."}, {"q": "고환그물의 위치와 상피 형태를 설명하시오.", "a": "고환그물은 고환종격 내에 위치하며 단층입방상피 또는 단층원주상피를 가진다."}, {"q": "고환날세관의 개수, 상피세포, 근육층을 설명하시오.", "a": "10–15개의 세관으로 제시되며, 상피는 단층원주상피와 거짓중층원주상피이고 무섬모세포·섬모세포·기저세포가 있다. 근육층은 평활근이 돌림층을 형성하여 연동수축에 관여한다."}, {"q": "고환날세관의 섬모세포와 무섬모세포가 관의 기능적 환경에 어떤 차이를 만들 수 있는지 자료 범위에서 설명하시오.", "a": "자료는 섬모세포와 무섬모세포를 구분하고 평활근의 돌림층과 연동수축을 함께 제시한다. 따라서 상피의 세포 구성과 근육층 수축이 고환에서 부고환으로 이어지는 관내 내용물 이동에 관여하는 구조적 특징으로 설명할 수 있다."}, {"q": "배설생식관(excretory genital ducts)의 네 구조를 쓰시오.", "a": "부고환관, 정관, 사정관, 요도이다."}, {"q": "부고환의 위치와 head, body, tail 구성을 설명하시오.", "a": "부고환은 고환의 뒤모서리에 붙어 있으며 head, body, tail로 구성된다."}, {"q": "부고환관의 길이와 형태, 상피 및 주요 세포를 설명하시오.", "a": "부고환 내에서 나선형으로 꼬인 하나의 긴 관이며 길이는 4–6 m이다. 상피는 거짓중층원주상피이고 주세포와 기저세포가 있으며 stereocilia가 있다."}, {"q": "부고환관 바깥쪽 결합조직의 특징을 설명하시오.", "a": "기저판 바깥쪽에는 평활근세포와 혈관이 풍부한 결합조직이 있다."}, {"q": "정관의 점막을 상피와 점막고유판으로 나누어 설명하시오.", "a": "점막상피는 부동모가 있는 거짓중층원주상피이고, 점막고유판은 탄력섬유가 풍부한 결합조직이다."}, {"q": "정관의 근육층 배열을 설명하고 이것이 관 구조에서 갖는 의미를 서술하시오.", "a": "안쪽과 바깥쪽은 세로층이고 중간은 돌림층이다. 자료에서 정관은 이러한 근육층을 가지는 관으로 제시되므로 내용물 이동을 위한 수축성 구조라는 관점에서 설명할 수 있다."}, {"q": "정관의 바깥막(adventitia)을 설명하시오.", "a": "혈관이 풍부한 성긴결합조직으로 구성된다."}, {"q": "사정관의 길이, 직경, 위치, 개구부 및 상피를 설명하시오.", "a": "길이 약 2 cm, 직경 0.1–0.3 mm이며 전립샘에 묻혀 있고 전립샘부분 요도에 열린다. 상피는 단층원주상피와 거짓중층원주상피이다."}, {"q": "부속생식샘의 세 종류를 쓰시오.", "a": "정낭(seminal vesicle), 전립샘(prostate), 요도망울샘(bulbourethral/Cowper's gland)이다."}, {"q": "정낭의 구조적 특징을 설명하시오.", "a": "약 15 cm 길이의 심하게 꼬인 두 개의 관이며 정관팽대 외측에서 방광바닥에 접한다. 점막은 거짓중층원주상피와 단층원주상피, 근육층은 안쪽 돌림층과 바깥쪽 세로층, 외막은 성긴결합조직이다."}, {"q": "정낭 분비물의 성상과 사정액 내 비율을 설명하시오.", "a": "노란색이고 점도가 높으며 사정액의 약 70%를 차지한다. pH 7.2로 제시되어 있다."}, {"q": "정낭 분비물에 포함된 주요 물질과 정자와 관련된 의미를 설명하시오.", "a": "fructose, citrate, inositole, prostaglandin 등이 포함되며 자료에서는 정자를 활성화시키는 물질로 제시된다."}, {"q": "전립샘의 샘 구조와 관의 개구부를 설명하시오.", "a": "30–50개의 분지된 관포상샘으로 구성되고 관은 전립샘요도로 열린다."}, {"q": "전립샘의 상피, 구역 및 간질(stroma)을 설명하시오.", "a": "상피는 단층 또는 거짓중층원주상피이다. peripheral, central, transitional, periurethral zone이 제시된다. stroma는 평활근세포가 풍부한 fibromuscular stroma이다."}, {"q": "전립샘 피막과 전립샘돌(prostatic concretion/corpora amylacea)을 설명하시오.", "a": "전립샘 피막은 평활근섬유가 풍부한 섬유탄력피막이다. 전립샘돌은 prostatic concretion 또는 corpora amylacea로 제시된다."}, {"q": "BPH가 자료에서 전립샘과 관련하여 어떻게 제시되는지 설명하시오.", "a": "자료에서는 BPH를 benign prostatic hyperplasia로 제시하고 전립샘 비대와 연결한다. 또한 전립샘의 구역 및 구조가 함께 제시된다."}, {"q": "요도망울샘의 크기, 위치, 개구부를 설명하시오.", "a": "직경 3–5 mm의 관포상샘이며 요생식격막에 위치하고 해면체요도에 열린다."}, {"q": "요도망울샘의 상피와 피막/간질 구조를 설명하시오.", "a": "상피는 단층입방 또는 원주상피이며 점액분비세포가 있다. 중격에는 골격근과 평활근이 존재하고 피막은 치밀결합조직이다."}, {"q": "음경의 3개 원통형 발기조직을 쓰시오.", "a": "2개의 음경해면체(corpora cavernosa)와 1개의 요도해면체(corpus spongiosum)이다."}, {"q": "음경의 정맥공간과 지주의 조직학적 구성을 설명하시오.", "a": "정맥공간은 창없는 내피세포로 둘러싸이고, 지주는 결합조직섬유와 평활근세포로 구성된다."}, {"q": "음경꺼풀(prepuce)과 preputial glands에 대해 자료에 나온 내용을 설명하시오.", "a": "음경꺼풀에는 preputial glands(glands of Tyson)가 제시되며, 이 샘은 기름샘으로 표시되어 있다."}, {"q": "음경등동맥과 음경깊은동맥의 분포를 비교하시오.", "a": "음경등동맥은 corpus spongiosum, bulb, skin으로, 음경깊은동맥은 corpora cavernosa로 가는 가지로 제시된다."}, {"q": "helicine arteries, 동정맥연결(arteriovenous shunt), 해면체동굴의 관계를 설명하시오.", "a": "자료에서는 helicine arteries와 동정맥연결이 제시되고, 해면체동굴(cavernous space) 및 수출정맥(efferent vein)이 함께 음경 혈관 구조로 설명된다."}, {"q": "자료에서 발기와 관련하여 제시한 두 화학물질을 쓰시오.", "a": "nitric oxide와 phosphodiesterase가 제시된다."}, {"q": "수컷생식기의 관 구조를 '정자 형성 부위→고환 내 이동→고환 밖 이동→부속생식샘과 합류→배출'의 흐름으로 정리하시오.", "a": "정세관에서 정자발생이 일어난 뒤 곧은정세관 → 고환그물 → 고환날세관 → 부고환관 → 정관 → 사정관 → 요도의 흐름으로 이어진다. 부속생식샘으로 정낭·전립샘·요도망울샘이 제시된다."}, {"q": "정세관과 부고환관을 현미경으로 구분할 때 사용할 수 있는 자료상의 핵심 특징을 비교하시오.", "a": "정세관은 중층정세관상피로 정자발생세포와 Sertoli cell이 있고, 부고환관은 거짓중층원주상피와 주세포·기저세포, stereocilia를 가진다."}, {"q": "Sertoli cell과 Leydig cell의 위치와 분비 기능을 비교하시오.", "a": "Sertoli cell은 정세관의 생식상피를 구성하는 지지세포로 정자 지지·보호·영양 조절 및 ABP, inhibin, activin, 태아기 AMH 등을 분비한다. Leydig cell은 정세관 사이질에 위치하며 testosterone을 분비한다."}];
let score=0; const answered=new Array(mc.length).fill(false);
const labels=["①","②","③","④","⑤"];

function renderMC(){
 const box=document.getElementById("mc");
 mc.forEach((item,i)=>{
  const card=document.createElement("div"); card.className="card";
  card.innerHTML=`<div class="qno">객관식 ${i+1} / 20</div><div class="q">${item.q}</div>`;
  item.options.forEach((op,j)=>{
   const b=document.createElement("button"); b.className="option"; b.textContent=labels[j]+" "+op;
   b.onclick=()=>choose(i,j,card); card.appendChild(b);
  });
  const fb=document.createElement("div"); fb.className="feedback"; card.appendChild(fb);
  box.appendChild(card);
 });
}
function choose(i,j,card){
 if(answered[i]) return; answered[i]=true;
 const item=mc[i], buttons=[...card.querySelectorAll(".option")], fb=card.querySelector(".feedback");
 buttons[item.answer].classList.add("correct");
 if(j===item.answer){score++;fb.innerHTML='<span class="answer">정답! ✓</span><br>'+item.explanation;}
 else{buttons[j].classList.add("wrong");fb.innerHTML='<span class="answer">오답.</span> 정답은 '+labels[item.answer]+'입니다.<br>'+item.explanation;}
 fb.classList.add("show"); document.getElementById("score").textContent="객관식 점수: "+score+" / 20";
}
function renderEssay(){
 const box=document.getElementById("essay");
 essay.forEach((item,i)=>{
  const card=document.createElement("div"); card.className="card";
  card.innerHTML=`<div class="qno">주관식 ${i+1} / 50</div><div class="q">${item.q}</div><textarea placeholder="여기에 직접 답안을 작성해보세요."></textarea><details><summary>모범답안 보기</summary><div class="model">${item.a}</div></details>`;
  box.appendChild(card);
 });
}
renderMC();renderEssay();
</script>
</body>
</html>
