["자궁의 주요 영역을 쓰시오.","자궁각, 자궁체, 자궁경부로 구분할 수 있다."],
["자궁벽의 세 층을 설명하시오.","안쪽 endometrium, 가운데 myometrium, 바깥쪽 perimetrium으로 구성된다."],
["자궁내막의 조직학적 구성과 기능을 설명하시오.","상피, 자궁샘, 혈관과 결합조직으로 구성되며 주기적 호르몬 변화에 반응하고 착상 및 임신 유지에 관여한다."],
["자궁샘의 역할을 서술하시오.","자궁강에 분비물을 제공하여 자궁내 환경 유지에 기여한다."],
["stratum vasculosa를 설명하시오.","자궁벽에서 혈관이 풍부한 층으로 자료에서 제시되는 구조이다."],
["perimetrium을 설명하시오.","자궁의 가장 바깥쪽 장막성 층으로 자궁 표면을 덮는다."],
["발정주기의 proestrus를 설명하시오.","난포의 성장과 estrogen 증가가 두드러지는 시기이다."],
["estrus의 특징을 서술하시오.","암컷의 성적 수용성이 나타나는 시기로, 종에 따라 배란 시기와 밀접하게 연관된다."],
["LH surge와 배란의 관계를 설명하시오.","LH surge가 성숙 난포의 배란을 유도하며, 이후 황체 형성이 시작된다."],
["metestrus와 diestrus의 차이를 서술하시오.","metestrus는 배란 직후 황체 형성이 진행되는 시기이고, diestrus는 기능하는 황체의 영향이 상대적으로 두드러지는 시기이다."],
["외부생식기의 주요 구조를 서술하시오.","외음부와 음핵 등이 주요 외부생식기 구조이다."],
["음핵의 발달학적 대응 구조를 서술하시오.","음핵은 수컷의 음경과 발달학적으로 대응하는 구조이다."],
["태반의 fetal part와 maternal part를 구분하여 설명하시오.","fetal part는 주로 chorion에서 유래하며, maternal part는 종과 태반 유형에 따라 자궁측 조직의 일부가 담당한다."],
["chorion frondosum과 chorion laeve의 차이를 설명하시오.","chorion frondosum은 융모가 발달한 chorion이고, chorion laeve는 융모가 상대적으로 소실되어 매끈해진 chorion이다."],
["태아막 네 가지를 쓰고 각각의 주요 특징을 간단히 설명하시오.","amnion은 태아를 둘러싸고, chorion은 태반 형성의 주요 태아측 막이며, yolk sac은 초기 영양·혈액형성과 관련되고, allantois는 혈관 및 요막 관련 기능을 가진다."],
["yolk sac의 주요 역할을 설명하시오.","초기 배아에서 영양 및 혈액형성 등과 관련된 기능을 수행한다."],
["chorioallantoic placenta가 무엇인지 설명하시오.","chorion과 allantois가 결합하여 형성되는 태아측 태반 구조이다."],
["diffuse placenta와 대표 동물을 서술하시오.","태반 접촉 부위가 자궁 표면에 넓게 분포하는 형태이며 자료에서는 말과 돼지가 대표 예로 제시된다."],
["cotyledonary placenta와 대표 동물을 서술하시오.","태반 교환 부위가 cotyledon 단위로 분포하는 형태이며 반추동물이 대표적이다."],
["zonary placenta와 대표 동물을 서술하시오.","교환 부위가 띠 모양으로 둘러싸는 형태이며 개와 고양이가 대표적이다."],
["discoid placenta와 대표 동물을 서술하시오.","교환 부위가 원반 모양으로 집중되는 형태이며 영장류와 설치류가 대표적이다."],
["folded placenta를 설명하시오.","태반 표면이 주름 또는 접힘을 형성하여 모체와 태아 사이의 접촉면을 증가시키는 형태이다."],
["villous placenta를 설명하시오.","융모(villi)가 발달하여 교환 표면을 형성하는 태반 형태이다."],
["labyrinthine placenta를 설명하시오.","태아와 모체의 혈관 주변에 복잡한 미로 형태의 교환 영역이 발달하는 태반 형태이다."],
["hemochorial placenta를 설명하시오.","모체의 혈액이 태아측 chorionic trophoblast와 직접 접하는 형태로 분류된다."],
["deciduate와 nondeciduate placenta의 차이를 서술하시오.","deciduate placenta는 태반 분리 때 모체 조직의 일부가 함께 탈락하는 반면, nondeciduate placenta는 모체 조직의 큰 손실 없이 분리되는 형태이다."],
["비탈락성 태반에서 모체측 접촉 조직을 이해할 때 주의할 점을 설명하시오.","nondeciduate라는 말은 모체 조직이 크게 탈락하지 않는다는 분리 방식의 분류이며, 실제 모체-태아 경계에 어떤 조직층이 남는지는 epitheliochorial, endotheliochorial, hemochorial 등의 조직학적 분류와 별도로 판단해야 한다."],
["태반의 조직학적 분류에서 maternal-fetal barrier를 결정하는 기준을 서술하시오.","태아측 chorionic 조직과 모체측 조직 사이에 어떤 층들이 남아 있는지를 기준으로 분류한다."],
["epitheliochorial placenta에서 모체측 경계에 남는 조직을 설명하시오.","모체 자궁상피가 태아 chorion과 경계를 이루는 형태이다."],
["endotheliochorial placenta에서 남는 모체측 조직을 설명하시오.","모체 결합조직과 상피가 소실되고 모체 혈관의 내피가 태아측 chorion과 경계를 이루는 형태로 분류된다."],
["hemochorial placenta에서 모체측 경계를 설명하시오.","모체 혈액이 태아측 chorionic trophoblast와 직접 접한다."],
["태반의 형태학적 분류와 조직학적 분류를 구분하여 설명하시오.","diffuse/cotyledonary/zonary/discoid는 태반의 접촉 부위 분포에 따른 gross 형태 분류이고, epitheliochorial/endotheliochorial/hemochorial 등은 모체-태아 경계의 조직층에 따른 조직학적 분류이다."],
["태반에서 산소와 영양소 교환이 일어나는 기본 원리를 설명하시오.","모체와 태아의 혈액이 직접 섞이지 않더라도 태반 장벽을 사이에 두고 농도 및 압력 차 등에 따라 산소와 영양소가 교환된다."],
["수의조직학에서 종 차이가 태반을 공부할 때 중요한 이유를 서술하시오.","동물 종마다 태반의 접촉 분포와 모체-태아 경계 조직층이 다르므로 동일한 분류 하나만으로 모든 종을 설명할 수 없다."]
];

let idx=0, answered=Array(50).fill(false), correct=Array(50).fill(false);
function render(){
 const q=document.getElementById("quiz");
 if(idx<50){
  const x=mc[idx];
  q.innerHTML=`<div class="muted">객관식 ${idx+1} / 50</div><h2>${x[0]}</h2>`+
   x.slice(1,5).map((o,i)=>`<button class="option" onclick="answer(${i})">${i+1}. ${o}</button>`).join("")+
   `<div id="feedback"></div>`;
 }else{
  const e=essay[idx-50];
  q.innerHTML=`<div class="muted">서술형 ${idx-49} / 50</div><h2>${e[0]}</h2>
  <textarea placeholder="여기에 답안을 작성하세요."></textarea>
  <button onclick="document.getElementById('ans').style.display='block'">모범답안 보기</button>
  <div class="answer" id="ans">${e[1]}</div>`;
 }
}
function answer(i){
 const x=mc[idx], buttons=document.querySelectorAll(".option");
 if(answered[idx])return;
 answered[idx]=true; correct[idx]=(i===x[5]);
 buttons.forEach((b,k)=>{if(k===x[5])b.classList.add("correct"); if(k===i&&i!==x[5])b.classList.add("wrong");});
 document.getElementById("feedback").textContent=(i===x[5]?"정답입니다! ":"오답입니다. 정답은 "+(x[5]+1)+"번입니다. ")+"핵심: "+x[1];
 document.getElementById("score").textContent=`객관식 점수: ${correct.filter(Boolean).length} / 50`;
}
function next(){if(idx<99){idx++;render();scrollTo(0,0)}}
function prev(){if(idx>0){idx--;render();scrollTo(0,0)}}
render();
</script>
</body></html>
