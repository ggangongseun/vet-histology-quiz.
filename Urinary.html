<script>
const data=[{"type": "mc", "title": "객관식 1", "q": "다음 중 신장의 기능으로 보기 어려운 것은?", "opts": ["체액·전해질 조절", "산-염기 조절", "노폐물 배설", "담즙산 합성", "혈압 조절"], "ans": 3, "exp": "신장은 체액·전해질 및 산-염기 조절, 노폐물 배설, 혈압 조절, 여러 내분비 기능 등을 수행한다."}, {"type": "mc", "title": "객관식 2", "q": "다음 중 신장의 내분비 기능과 관련이 없는 것은?", "opts": ["Renin", "Erythropoietin", "Prostaglandin", "1,25-dihydroxyvitamin D3", "Insulin"], "ans": 4, "exp": "강의자료에서는 renin, erythropoietin, prostaglandin, 1,25-dihydroxyvitamin D3 등을 신장의 내분비 기능과 관련된 물질로 제시한다."}, {"type": "mc", "title": "객관식 3", "q": "Renin을 분비하는 세포는?", "opts": ["Macula densa", "Podocyte", "Juxtaglomerular cell", "Mesangial cell", "Principal cell"], "ans": 2, "exp": "Juxtaglomerular cell(JG cell)은 주로 수입세동맥에 존재하며 renin을 분비한다."}, {"type": "mc", "title": "객관식 4", "q": "신장문(hilum)을 통과하는 구조로 알맞은 것은?", "opts": ["Renal artery", "Collecting duct", "Glomerulus", "Macula densa", "PCT"], "ans": 0, "exp": "신장문에는 renal artery와 renal vein, 신우 등 신장으로 들어오고 나가는 구조들이 위치한다."}, {"type": "mc", "title": "객관식 5", "q": "강의자료에서 단엽성(unilobar) 신장의 예로 제시된 동물은?", "opts": ["소", "돼지", "개", "대형 반추동물", "고양이 이외의 모든 동물"], "ans": 2, "exp": "강의자료에서는 dog, cat, horse, sheep, goat를 unilobar kidney의 예로 제시한다."}, {"type": "mc", "title": "객관식 6", "q": "대형 반추동물의 신장 형태는?", "opts": ["Unilobar", "Multilobar with distinct boundaries", "Multilobar with fused surface", "Discoid", "Zonary"], "ans": 1, "exp": "대형 반추동물은 여러 엽이 뚜렷한 경계를 유지하는 multilobar kidney로 제시된다."}, {"type": "mc", "title": "객관식 7", "q": "돼지 신장의 형태는?", "opts": ["Unilobar", "Multilobar with distinct boundaries", "Multilobar with fused surface", "Bipartite", "Discoid"], "ans": 2, "exp": "돼지는 multilobar이지만 표면에서는 엽들이 융합된 형태로 제시된다."}, {"type": "mc", "title": "객관식 8", "q": "신장 피질(cortex)에서 볼 수 있는 구조는?", "opts": ["Renal corpuscle", "Ureteric smooth muscle only", "Only collecting ducts", "Only thin limbs", "Only vasa recta"], "ans": 0, "exp": "신장 피질에는 renal corpuscle과 convoluted tubules 등이 존재한다."}, {"type": "mc", "title": "객관식 9", "q": "Medullary ray에 대한 설명으로 알맞은 것은?", "opts": ["피질의 곧은 세뇨관 다발", "수질의 사구체 다발", "혈관만으로 구성", "신우의 주름", "방광 근육 다발"], "ans": 0, "exp": "Medullary ray는 피질에서 곧은 세뇨관들이 평행하게 모여 있는 구조이다."}, {"type": "mc", "title": "객관식 10", "q": "Cortical labyrinth는 어디에 위치하는가?", "opts": ["Medullary ray 사이", "신우 내부", "방광 내부", "사구체 내부", "요관 근육층"], "ans": 0, "exp": "Cortical labyrinth는 medullary ray 사이에 있으며 convoluted tubules와 renal corpuscles가 존재한다."}, {"type": "mc", "title": "객관식 11", "q": "Nephron에 대한 설명으로 가장 알맞은 것은?", "opts": ["신장의 구조·기능적 단위", "요관의 근육 단위", "방광의 기능 단위", "사구체만을 의미", "집합관만을 의미"], "ans": 0, "exp": "Nephron은 신장의 구조적·기능적 단위이다."}, {"type": "mc", "title": "객관식 12", "q": "다음 중 강의자료의 분류에서 nephron 자체에 포함되지 않는 것은?", "opts": ["Renal corpuscle", "PCT", "Loop of Henle", "DCT", "Collecting duct"], "ans": 4, "exp": "강의자료에서는 collecting duct가 발생학적으로 nephron과 다른 기원을 가지므로 nephron에 포함되지 않는다고 설명한다."}, {"type": "mc", "title": "객관식 13", "q": "Nephron 분류에 사용되는 기준은?", "opts": ["Renal corpuscle 위치와 loop 길이", "사구체 크기만", "요관 길이만", "방광 용적만", "신장 무게만"], "ans": 0, "exp": "강의자료에서는 renal corpuscle의 위치와 loop의 길이를 기준으로 nephron을 분류한다."}, {"type": "mc", "title": "객관식 14", "q": "Juxtamedullary nephron의 특징으로 알맞은 것은?", "opts": ["짧은 loop만 가진다", "수질 농축에 중요한 긴 loop를 가진다", "사구체가 신우에 있다", "collecting duct가 nephron이다", "항상 피질 표면에 위치한다"], "ans": 1, "exp": "Juxtamedullary nephron은 수질 깊숙이 내려가는 긴 loop와 관련되어 소변 농축에 중요하다."}, {"type": "mc", "title": "객관식 15", "q": "Renal corpuscle을 구성하는 것은?", "opts": ["Glomerular capillary rete + mesangium + Bowman's capsule", "PCT + DCT", "Collecting duct + ureter", "Vasa recta + collecting duct", "Renal pelvis + ureter"], "ans": 0, "exp": "강의자료에서는 glomerular capillary rete, mesangium, Bowman's capsule을 renal corpuscle의 구성요소로 제시한다."}, {"type": "mc", "title": "객관식 16", "q": "Renal corpuscle의 vascular pole에 위치하는 것은?", "opts": ["Afferent/efferent arterioles", "PCT/DCT", "Collecting duct", "Ureter", "Renal pelvis"], "ans": 0, "exp": "Vascular pole에는 수입세동맥과 수출세동맥이 위치한다."}, {"type": "mc", "title": "객관식 17", "q": "Renal corpuscle의 urinary pole에서 이어지는 세뇨관은?", "opts": ["PCT", "DCT", "TAL", "Collecting duct", "Ureter"], "ans": 0, "exp": "Urinary pole에서는 proximal tubule이 시작된다."}, {"type": "mc", "title": "객관식 18", "q": "사구체로 혈액을 들어오게 하는 혈관은?", "opts": ["Efferent arteriole", "Afferent arteriole", "Interlobular vein", "Arcuate vein", "Renal vein"], "ans": 1, "exp": "Afferent arteriole이 사구체로 혈액을 공급한다."}, {"type": "mc", "title": "객관식 19", "q": "사구체에서 혈액을 빠져나가게 하는 혈관은?", "opts": ["Afferent arteriole", "Efferent arteriole", "Renal artery", "Arcuate artery", "Interlobar artery"], "ans": 1, "exp": "Efferent arteriole이 사구체 모세혈관에서 혈액을 배출한다."}, {"type": "mc", "title": "객관식 20", "q": "사구체 여과장벽의 순서로 알맞은 것은?", "opts": ["Fenestrated endothelium → GBM → podocyte filtration slit", "GBM → endothelium → mesangium", "Podocyte → GBM → artery", "Mesangium → endothelium → PCT", "Endothelium → DCT → GBM"], "ans": 0, "exp": "여과장벽은 fenestrated endothelium, GBM, podocyte foot process 사이의 filtration slit로 구성된다."}, {"type": "mc", "title": "객관식 21", "q": "다음 중 GBM의 층이 아닌 것은?", "opts": ["Lamina rara interna", "Lamina densa", "Lamina rara externa", "Lamina muscularis", ""], "ans": 3, "exp": "GBM은 lamina rara interna, lamina densa, lamina rara externa의 세 층으로 설명된다."}, {"type": "mc", "title": "객관식 22", "q": "GBM 구성성분으로 강의자료에 제시된 것은?", "opts": ["Type IV collagen", "Heparan sulfate proteoglycan", "Laminin", "Fibronectin/entactin", "모두 해당"], "ans": 4, "exp": "강의자료에서는 type IV collagen, heparan sulfate proteoglycan, laminin, fibronectin, entactin 등을 제시한다."}, {"type": "mc", "title": "객관식 23", "q": "Podocyte에 대한 설명으로 알맞은 것은?", "opts": ["Bowman's capsule의 visceral layer를 이룬다", "사구체 내피세포다", "수입세동맥의 평활근이다", "Collecting duct 세포다", "요관 상피세포다"], "ans": 0, "exp": "Podocyte는 Bowman's capsule의 visceral layer를 이루며 사구체 모세혈관을 둘러싼다."}, {"type": "mc", "title": "객관식 24", "q": "Podocyte 돌기의 순서로 알맞은 것은?", "opts": ["Primary → secondary → tertiary → foot processes", "Foot → primary → secondary → tertiary", "Secondary → primary → foot → tertiary", "Tertiary → primary → secondary → foot", "Primary → tertiary → secondary → foot"], "ans": 0, "exp": "Podocyte의 돌기는 primary process에서 secondary, tertiary process를 거쳐 foot process로 이어지는 형태로 설명된다."}, {"type": "mc", "title": "객관식 25", "q": "Podocyte foot process 사이의 구조는?", "opts": ["Filtration slit", "Macula densa", "Basal infolding", "Brush border", "Vasa recta"], "ans": 0, "exp": "Foot process 사이에는 filtration slit가 형성되고 slit diaphragm이 존재한다."}, {"type": "mc", "title": "객관식 26", "q": "Mesangial cell의 기능으로 보기 어려운 것은?", "opts": ["Phagocytosis", "Matrix production", "혈류 조절에 관여", "Renin 저장", ""], "ans": 3, "exp": "강의자료에서는 mesangial cell의 phagocytosis, matrix production, 혈류 조절 관여 등을 설명한다. Renin은 JG cell과 관련된다."}, {"type": "mc", "title": "객관식 27", "q": "PCT의 상피는?", "opts": ["Simple squamous", "Simple cuboidal", "Stratified squamous", "Transitional", "Simple columnar only"], "ans": 1, "exp": "PCT는 simple cuboidal epithelium으로 설명된다."}, {"type": "mc", "title": "객관식 28", "q": "PCT를 현미경적으로 구별하는 대표적 특징은?", "opts": ["Brush border", "Urothelium", "Stratified squamous epithelium", "Cartilage", "Keratin layer"], "ans": 0, "exp": "PCT의 S1 segment에는 잘 발달한 brush border가 있다."}, {"type": "mc", "title": "객관식 29", "q": "PCT의 S1 segment에서 특히 잘 발달한 것은?", "opts": ["Brush border", "Cilia", "Keratin", "Goblet cells", "Thick capsule"], "ans": 0, "exp": "S1에서는 brush border가 특히 발달해 있다."}, {"type": "mc", "title": "객관식 30", "q": "PCT의 기능에 대한 설명 중 틀린 것은?", "opts": ["물 재흡수", "염 재흡수", "포도당 재흡수", "아미노산 재흡수", "대부분의 단백질을 그대로 통과시켜 소변으로 배설"], "ans": 4, "exp": "PCT는 소수 단백질의 재흡수에도 관여하며, 강의자료에서는 vesicle/endosome/lysosome을 통한 단백질 재흡수를 설명한다."}, {"type": "mc", "title": "객관식 31", "q": "PCT에서 분비되는 물질의 예는?", "opts": ["Organic ions와 일부 약물", "Insulin", "Hemoglobin만", "Bile acids만", "Aldosterone"], "ans": 0, "exp": "PCT는 organic ions와 일부 약물의 분비에 관여한다."}, {"type": "mc", "title": "객관식 32", "q": "DTL의 특징은?", "opts": ["물 투과성이 높다", "물 투과성이 없다", "NaCl만 선택적으로 통과", "Brush border가 매우 발달", "NKCC2가 주된 특징"], "ans": 0, "exp": "Descending thin limb은 물 투과성이 높아 수질의 삼투기울기에 따라 물이 재흡수된다."}, {"type": "mc", "title": "객관식 33", "q": "ATL의 특징은?", "opts": ["물 투과성이 높고 염 이동이 없다", "물 투과성이 낮고 염 이동이 가능하다", "Brush border가 매우 발달", "AQP2가 주된 채널", "Urothelium이다"], "ans": 1, "exp": "Ascending thin limb은 물 투과성이 낮고 salt 이동이 가능하다."}, {"type": "mc", "title": "객관식 34", "q": "TAL의 대표적인 수송체는?", "opts": ["NKCC2", "AQP2", "ENaC only", "Na-Cl cotransporter", "ROMK only"], "ans": 0, "exp": "TAL의 apical membrane에는 Na-K-2Cl cotransporter인 NKCC2가 제시된다."}, {"type": "mc", "title": "객관식 35", "q": "NKCC2가 운반하는 조합은?", "opts": ["Na+ 1, K+ 1, Cl− 2", "Na+ 2, K+ 2", "Na+ 1, Cl− 1만", "K+ 1, Cl− 1만", "Na+ 1, Ca2+ 1"], "ans": 0, "exp": "NKCC2는 Na+, K+, 2Cl−를 함께 이동시키는 cotransporter이다."}, {"type": "mc", "title": "객관식 36", "q": "DCT의 대표적 수송체는?", "opts": ["Na-Cl cotransporter", "NKCC2", "AQP2", "H+/K+ ATPase only", "Na-K-2Cl cotransporter"], "ans": 0, "exp": "DCT에서는 Na-Cl cotransporter가 제시된다."}, {"type": "mc", "title": "객관식 37", "q": "DCT에서 재흡수되는 이온의 예는?", "opts": ["Ca2+", "Hemoglobin", "Bile salt", "Insulin", "Albumin만"], "ans": 0, "exp": "강의자료에서는 DCT의 Ca2+ 재흡수를 설명한다."}, {"type": "mc", "title": "객관식 38", "q": "Collecting duct에 대한 설명으로 알맞은 것은?", "opts": ["Nephron의 일부가 아니다", "항상 nephron의 일부다", "사구체를 이룬다", "Bowman's capsule이다", "PCT와 동일하다"], "ans": 0, "exp": "Collecting duct는 발생학적 기원이 달라 nephron에 포함되지 않는다고 강의자료에 제시된다."}, {"type": "mc", "title": "객관식 39", "q": "Collecting duct의 상피는 수질로 갈수록?", "opts": ["Cuboidal → columnar", "Columnar → squamous", "Squamous → cuboidal", "Stratified → simple", "Transitional → squamous"], "ans": 0, "exp": "Collecting duct는 수질 방향으로 갈수록 simple cuboidal에서 columnar 형태로 변한다."}, {"type": "mc", "title": "객관식 40", "q": "Principal cell의 대표적 기능은?", "opts": ["Na+ 흡수 및 K+ 분비", "HCO3−만 분비", "단백질 여과", "Renin 분비", "담즙 분비"], "ans": 0, "exp": "Principal cell은 Na+ 흡수와 K+ 분비에 관여한다."}, {"type": "mc", "title": "객관식 41", "q": "Principal cell의 Na+ 흡수를 촉진하는 대표적인 호르몬은?", "opts": ["Aldosterone", "Insulin", "TSH", "Calcitonin", "Prolactin"], "ans": 0, "exp": "Aldosterone은 principal cell의 Na+ 재흡수와 K+ 분비를 촉진한다."}, {"type": "mc", "title": "객관식 42", "q": "ADH에 의해 직접 조절되는 대표적 aquaporin은?", "opts": ["AQP1", "AQP2", "AQP3", "AQP4", "AQP0"], "ans": 1, "exp": "ADH는 collecting duct principal cell의 apical membrane에 AQP2 삽입을 촉진한다."}, {"type": "mc", "title": "객관식 43", "q": "A-type intercalated cell의 대표적 기능은?", "opts": ["H+ 분비", "HCO3− 분비", "Na+만 흡수", "K+만 분비", "Renin 분비"], "ans": 0, "exp": "A-type intercalated cell은 H+를 분비하여 산-염기 조절에 관여한다."}, {"type": "mc", "title": "객관식 44", "q": "B-type intercalated cell의 대표적 기능은?", "opts": ["HCO3− 분비", "H+ 분비만", "Renin 분비", "Glucose 재흡수", "Albumin 여과"], "ans": 0, "exp": "B-type intercalated cell은 HCO3− 분비와 관련된다."}, {"type": "mc", "title": "객관식 45", "q": "Countercurrent multiplier에 해당하는 구조는?", "opts": ["Loop of Henle", "Vasa recta", "Collecting duct", "Ureter", "Glomerulus"], "ans": 0, "exp": "Loop of Henle은 countercurrent multiplier로 수질의 삼투기울기를 형성한다."}, {"type": "mc", "title": "객관식 46", "q": "Countercurrent exchanger에 해당하는 구조는?", "opts": ["Loop of Henle", "Vasa recta", "PCT", "DCT", "Glomerulus"], "ans": 1, "exp": "Vasa recta는 countercurrent exchanger로 수질 삼투기울기를 보존하는 데 중요하다."}, {"type": "mc", "title": "객관식 47", "q": "Vasa recta의 중요한 역할은?", "opts": ["수질 삼투기울기 보존", "사구체 여과장벽 형성", "Renin 합성", "Glucose 합성", "담즙 분비"], "ans": 0, "exp": "Vasa recta는 혈류가 수질의 삼투기울기를 washout하지 않도록 countercurrent exchange를 통해 보존한다."}, {"type": "mc", "title": "객관식 48", "q": "Juxtaglomerular complex의 세 구성요소는?", "opts": ["Macula densa + JG cells + extraglomerular mesangial cells", "Podocyte + PCT + DCT", "PCT + TAL + collecting duct", "Vasa recta + PCT + podocyte", "Ureter + bladder + urethra"], "ans": 0, "exp": "JG complex는 macula densa, juxtaglomerular cells, extraglomerular mesangial cells로 구성된다."}, {"type": "mc", "title": "객관식 49", "q": "Macula densa가 감지하는 대표적인 것은?", "opts": ["Tubular NaCl", "혈당만", "혈압만 직접", "Albumin만", "산소만"], "ans": 0, "exp": "Macula densa는 세뇨관 내 NaCl을 감지하여 GFR 조절 등에 관여한다."}, {"type": "mc", "title": "객관식 50", "q": "요관과 방광의 대표적인 상피는?", "opts": ["Urothelium", "Keratinized stratified squamous", "Simple columnar", "Pseudostratified ciliated", "Simple cuboidal"], "ans": 0, "exp": "요관과 방광의 점막은 urothelium(transition epithelium)으로 설명된다."}, {"type": "essay", "title": "서술형 1", "q": "신장의 주요 기능을 5가지 이상 서술하시오.", "ans": "체액·전해질 조절, 산-염기 조절, 노폐물 배설, 혈압 조절, 내분비 기능 등을 서술한다.", "exp": ""}, {"type": "essay", "title": "서술형 2", "q": "신장의 내분비 기능과 관련된 물질을 강의자료에 따라 서술하시오.", "ans": "Renin, erythropoietin, prostaglandin, 1,25-dihydroxyvitamin D3, kallikrein 등을 제시한다.", "exp": ""}, {"type": "essay", "title": "서술형 3", "q": "Unilobar kidney와 multilobar kidney를 구분하고 강의자료에 제시된 동물 예를 쓰시오.", "ans": "Dog, cat, horse, sheep, goat는 unilobar. Large ruminants는 distinct boundaries를 가진 multilobar. Pig는 fused surface를 가진 multilobar로 제시된다.", "exp": ""}, {"type": "essay", "title": "서술형 4", "q": "Cortical labyrinth와 medullary ray의 차이를 설명하시오.", "ans": "Medullary ray는 피질 내 straight tubule bundle이고, cortical labyrinth는 그 사이에 위치하며 convoluted tubules와 renal corpuscles를 포함한다.", "exp": ""}, {"type": "essay", "title": "서술형 5", "q": "신장 피질과 수질에서 관찰되는 대표적 구조를 비교하시오.", "ans": "피질에는 renal corpuscles, convoluted tubules, medullary rays 등이 있고 수질에는 straight tubules/collecting ducts 등이 주로 위치한다.", "exp": ""}, {"type": "essay", "title": "서술형 6", "q": "Nephron의 정의와 주요 구성요소를 순서대로 서술하시오.", "ans": "Renal corpuscle → PCT → proximal straight tubule/thick descending limb → thin descending limb → thin ascending limb → thick ascending limb → macula densa → DCT → connecting tubule 등의 순서를 강의자료에 맞춰 서술한다.", "exp": ""}, {"type": "essay", "title": "서술형 7", "q": "Nephron을 renal corpuscle의 위치와 loop 길이에 따라 어떻게 분류하는지 설명하시오.", "ans": "Superficial, midcortical, juxtamedullary 등의 위치 및 short-looped/long-looped 등의 loop 길이 기준을 설명한다.", "exp": ""}, {"type": "essay", "title": "서술형 8", "q": "Renal corpuscle의 구성요소와 vascular pole, urinary pole을 설명하시오.", "ans": "Glomerular capillary rete + mesangium + Bowman's capsule. Vascular pole에는 afferent/efferent arterioles, urinary pole에서는 PCT가 이어진다.", "exp": ""}, {"type": "essay", "title": "서술형 9", "q": "사구체 모세혈관의 혈류 방향을 서술하시오.", "ans": "Afferent arteriole → glomerular capillary rete → efferent arteriole.", "exp": ""}, {"type": "essay", "title": "서술형 10", "q": "Glomerular filtration barrier의 세 구성요소를 서술하시오.", "ans": "Fenestrated glomerular endothelium → GBM → podocyte foot processes 사이 filtration slit/slit diaphragm.", "exp": ""}, {"type": "essay", "title": "서술형 11", "q": "GBM의 세 층과 주요 구성성분을 서술하시오.", "ans": "Lamina rara interna, lamina densa, lamina rara externa. Type IV collagen, heparan sulfate proteoglycan, laminin, fibronectin, entactin 등이 제시된다.", "exp": ""}, {"type": "essay", "title": "서술형 12", "q": "Podocyte의 구조와 filtration slit/slit diaphragm을 설명하시오.", "ans": "Podocyte는 visceral layer를 이루며 primary→secondary→tertiary processes→foot processes로 분지한다. Foot process 사이 filtration slit와 slit diaphragm이 존재한다.", "exp": ""}, {"type": "essay", "title": "서술형 13", "q": "Mesangial cell의 주요 기능을 서술하시오.", "ans": "Phagocytosis, mesangial matrix production, 사구체 혈류 조절 등에 관여한다.", "exp": ""}, {"type": "essay", "title": "서술형 14", "q": "PCT의 조직학적 특징과 brush border, basal infolding의 기능적 의미를 설명하시오.", "ans": "Simple cuboidal epithelium, 잘 발달한 brush border, lateral interdigitations, basal infoldings와 mitochondria 등이 특징이며 재흡수 능력과 관련된다.", "exp": ""}, {"type": "essay", "title": "서술형 15", "q": "PCT에서 일어나는 주요 재흡수와 분비 기능을 서술하시오.", "ans": "Water, salt, glucose, amino acids, small proteins 등을 재흡수하고 organic ions와 일부 약물을 분비한다.", "exp": ""}, {"type": "essay", "title": "서술형 16", "q": "Loop of Henle의 주요 구간을 올바른 순서로 쓰고 각 구간의 기본적 특징을 설명하시오.", "ans": "PST/TDL → DTL → ATL → TAL. Thin limbs는 단순편평상피가 중심이고, DTL은 물 투과성이 높으며 ATL/TAL은 물 투과성이 낮고 염 이동에 중요하다.", "exp": ""}, {"type": "essay", "title": "서술형 17", "q": "DTL과 ATL의 물과 염에 대한 투과성 차이를 설명하시오.", "ans": "DTL은 물 투과성이 높고 salt/urea에 상대적으로 낮으며, ATL은 물 투과성이 낮고 salt 이동이 가능하다.", "exp": ""}, {"type": "essay", "title": "서술형 18", "q": "TAL의 조직학적 특징과 NKCC2의 기능을 설명하시오.", "ans": "TAL은 cuboidal cells, basal infolding과 mitochondria가 발달하며 NKCC2를 통해 Na+, K+, 2Cl−를 재흡수한다. 물에는 투과성이 낮다.", "exp": ""}, {"type": "essay", "title": "서술형 19", "q": "TAL의 NaCl 재흡수가 수질 간질과 세뇨관액에 각각 어떤 영향을 주는지 설명하시오.", "ans": "TAL은 물이 잘 통과하지 않는 상태에서 NaCl을 재흡수하여 수질 간질의 삼투농도를 높이고, TAL을 지나는 세뇨관액은 상대적으로 희석된다.", "exp": ""}, {"type": "essay", "title": "서술형 20", "q": "DCT의 조직학적 특징과 주요 이온 수송을 설명하시오.", "ans": "PCT보다 짧고 brush border가 없으며 짧은 apical projection, 많은 mitochondria, basolateral infolding이 특징이다. Na-Cl cotransporter와 Ca2+ 재흡수가 제시된다.", "exp": ""}, {"type": "essay", "title": "서술형 21", "q": "Collecting duct가 nephron에 포함되지 않는 이유를 설명하시오.", "ans": "Collecting duct는 nephron과 발생학적 기원이 다르기 때문에 nephron의 일부가 아닌 별도의 관계통으로 설명된다.", "exp": ""}, {"type": "essay", "title": "서술형 22", "q": "Principal cell의 구조와 Na+, K+, water homeostasis에서의 역할을 설명하시오.", "ans": "Principal cell은 비교적 투명한 cuboidal/low columnar cell이며 Na+ 흡수와 K+ 분비에 관여한다. Aldosterone과 ADH에 반응하여 체액 조절에 기여한다.", "exp": ""}, {"type": "essay", "title": "서술형 23", "q": "ADH가 collecting duct에서 AQP2를 통해 물 재흡수를 증가시키는 과정을 설명하시오.", "ans": "ADH가 principal cell에 작용하여 apical membrane에 AQP2 삽입을 촉진하고, 물이 lumen에서 세포로 들어온 뒤 basolateral AQP3/AQP4를 통해 간질 쪽으로 이동할 수 있게 한다.", "exp": ""}, {"type": "essay", "title": "서술형 24", "q": "A-type과 B-type intercalated cell의 기능적 차이를 설명하시오.", "ans": "A-type은 H+ 분비, B-type은 HCO3− 분비에 관여하여 산-염기 조절을 수행한다.", "exp": ""}, {"type": "essay", "title": "서술형 25", "q": "Countercurrent multiplier와 countercurrent exchanger의 차이와 각각의 구조를 설명하시오.", "ans": "Loop of Henle은 countercurrent multiplier로 수질 삼투기울기를 형성하고, vasa recta는 countercurrent exchanger로 그 기울기를 보존한다.", "exp": ""}, {"type": "essay", "title": "서술형 26", "q": "Vasa recta의 하행부와 상행부에서 물과 용질 이동을 설명하시오.", "ans": "하행부에서는 수질로 내려가며 물이 빠져나가고 NaCl/urea가 혈액으로 들어오는 경향이 있고, 상행부에서는 반대 방향의 교환이 일어나 수질 기울기를 보존한다.", "exp": ""}, {"type": "essay", "title": "서술형 27", "q": "소변 농축 과정에서 Loop of Henle, vasa recta, collecting duct/ADH의 역할을 연결하여 설명하시오.", "ans": "Loop of Henle이 수질 삼투기울기를 형성하고 vasa recta가 이를 보존한다. ADH가 collecting duct의 AQP2를 증가시켜 형성된 기울기를 이용해 물 재흡수를 증가시킨다.", "exp": ""}, {"type": "essay", "title": "서술형 28", "q": "Juxtaglomerular complex의 세 구성요소와 기능을 설명하시오.", "ans": "Macula densa, JG cells, extraglomerular mesangial cells로 구성되며 NaCl 감지, renin 분비, tubuloglomerular feedback 및 혈압/여과 조절에 관여한다.", "exp": ""}, {"type": "essay", "title": "서술형 29", "q": "Renal artery에서 glomerulus까지의 혈관 흐름을 서술하시오.", "ans": "Renal artery → interlobar artery → arcuate artery → interlobular artery → afferent arteriole → glomerular capillary rete. 이후 efferent arteriole로 나간다.", "exp": ""}, {"type": "essay", "title": "서술형 30", "q": "요로의 일반적인 층과 요관·방광의 특징, 배뇨 조절을 설명하시오.", "ans": "Mucosa(urothelium) → propria/submucosa → smooth muscle muscularis → adventitia 또는 serosa. 방광은 urothelium과 detrusor muscle이 특징이며, 배뇨 시 parasympathetic stimulation이 detrusor contraction을 촉진한다.", "exp": ""}];
let i=0,score=0,answered=false;
const app=document.getElementById('app'),fill=document.getElementById('fill');
function render(){
 answered=false; const x=data[i]; fill.style.width=((i+1)/data.length*100)+'%';
 let s=`<div class="small">${i+1} / ${data.length} · ${x.type==='mc'?'객관식':'서술형'}</div><div class="q">${x.q}</div>`;
 if(x.type==='mc') s+=x.opts.map((o,j)=>`<button class="opt" onclick="answer(${j},this)">${j+1}. ${o}</button>`).join('');
 else s+=`<textarea id="ans" placeholder="답안을 직접 작성해보세요."></textarea><button onclick="showEssay()">모범 답안 보기</button>`;
 s+=`<div id="feedback"></div><div class="nav"><button onclick="prev()">← 이전</button><button onclick="next()">다음 →</button></div>`;
 app.innerHTML=s;
}
function answer(j,el){
 if(answered)return; answered=true;
 const x=data[i], buttons=document.querySelectorAll('.opt');
 buttons[x.ans].classList.add('correct');
 if(j===x.ans){score++;document.getElementById('feedback').innerHTML='<b>정답! 🎉</b><br>'+x.exp}
 else{el.classList.add('wrong');document.getElementById('feedback').innerHTML='<b>오답</b><br>정답: '+(x.ans+1)+'. '+x.opts[x.ans]+'<br>'+x.exp}
 document.getElementById('feedback').innerHTML += `<div class="small">현재 객관식 정답 ${score} / ${data.slice(0,50).length}</div>`;
}
function showEssay(){const x=data[i];document.getElementById('feedback').innerHTML='<b>모범 답안</b><br>'+x.ans}
function next(){if(i<data.length-1){i++;render()}else{app.innerHTML=`<h2>완료! 🎉</h2><div class="score">객관식 점수: ${score} / 50</div><p>서술형은 각 문제의 모범 답안과 자신의 답안을 비교해 복습하세요.</p><button onclick="i=0;score=0;render()">처음부터 다시 풀기</button>`}}
function prev(){if(i>0){i--;render()}}
render();
</script></body></html>
